[project]
name = "cloudsea"
version = "0.1.0"
description = "Tomorrow's sunrise cloud-sea call for Nandi Hills: TabPFN forecast, Gemma-written call, self-graded every morning."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astral>=3.2",
    "fastapi>=0.143.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.5",
    "tabpfn-client>=0.6.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8",
    "ruff>=0.6",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudsea"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
